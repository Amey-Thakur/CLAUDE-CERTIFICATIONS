name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe  # v24
        with:
          globs: "**/*.md"
          config: .github/.markdownlint.jsonc
      - name: Spell check
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579  # v2.2
        with:
          skip: "*.pdf,*.png,./.git"

  scripts:
    name: Scripts compile and generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python -m compileall -q .github/scripts .github/pages
      - name: Lint for unused names and undefined references
        run: |
          pip install --quiet pyflakes==3.4.0
          python -m pyflakes .github/scripts/*.py .github/pages/*.py
      - name: Shell syntax
        run: bash -n .github/pages/assemble.sh
      - name: House spelling stays American
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          WORDS = ("behaviour organis catalogue licence utilis recognis memoris programme "
                   "labelled centre practise prioritis colour whilst amongst modelling "
                   "customis defence offence").split()
          PATTERN = re.compile(r"\b\w*(" + "|".join(WORDS) + r")\w*\b", re.I)
          KEEP = (".md", ".py", ".tsv", ".yml", ".css", ".js")
          # This file names the forms it forbids, so it excludes itself.
          SKIP = ("/.git/", "site-src/", "_site/", "__pycache__", ".github/workflows/")
          found = []
          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or path.suffix not in KEEP:
                  continue
              if any(s in path.as_posix() for s in SKIP):
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              found += [f"{path}: {m.group(0)}" for m in PATTERN.finditer(text)]
          if found:
              print("This repository is written in American English. Found:")
              print("\n".join(found[:40]))
              sys.exit(1)
          print(f"spelling is uniform across {len(WORDS)} watched forms")
          PY
      - name: Regenerate the derived files and fail if they drift
        run: |
          python .github/scripts/build_question_bank.py
          python .github/scripts/build_tracker.py
          python .github/scripts/build_flashcards.py
          git diff --exit-code -- question-bank.json flashcards.tsv \
            guide/flashcards.md .github/assets/tracker.json .github/assets/flashcards.json
      # The images and the booklet need a browser, and the booklet is set in a
      # font the runner does not have, so re-rendering here would differ byte
      # for byte with nothing wrong. This asks the question that matters
      # instead: did a source change after the artifact was last built?
      - name: Images and booklet are current with their sources
        run: python .github/scripts/build_images.py --verify
